	<body>
		<div>
			
			<main></main>

<script>

	
	function loadData() {
		(async function() {
			try {
				const unfallatlasData = await d3.json("../public/accident_data_2016-2024.json")
				const germanyData = await d3.json("../public/germany_states.geo.json")
				const metadata = await d3.json("../public/metadata.json")
				const heatmap2022 = await d3.json("../public/heatmaps/heatmap_2022.json")
					const yearlyData = await d3.json("../public/accidents_by_year_state.json")
					const year2022Data = yearlyData.find(d => d.year === 2022).accident_data

					// call function to draw the map and the cities information using SVG only
					drawMap(unfallatlasData, germanyData, metadata, heatmap2022, year2022Data, {
					stateFillColor: "#ebd5ed",
					heatmapPalette: {
						mode: "threshold",
						thresholds: [0.25, 0.5],
						colors: ["#4AA44C", "#FAB228", "#EF4338"]
					}
				})
			} catch(error) {
				// console.log(error)
			}
		})();		
	}


	
	// load data and plot map
	loadData()		
	
  </script>
</html>
